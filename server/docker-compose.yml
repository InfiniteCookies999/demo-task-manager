services:
  postgres:
    image: postgres:17
    container_name: task-manager-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: task-manager
      POSTGRES_USER: username
      POSTGRES_PASSWORD: pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: