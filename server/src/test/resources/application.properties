spring.jpa.hibernate.ddl-auto=create-drop

# Disable SQL statement logging.
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF

# Hikari will keep trying to validate connects that test containers closed
# on shutdown. Tell it not to keep idle database connections open.
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.maximum-pool-size=5

# Hikari timeout after 5 seconds so tests stop hanging at the end.
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=1000
spring.datasource.hikari.initialization-fail-timeout=5000
