spring.application.name=task-manager

spring.datasource.url=jdbc:postgresql://${DB_ADDRESS}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Validate the entities against the created tables.
spring.jpa.hibernate.ddl-auto=validate

logging.level.org.flywaydb=DEBUG
logging.level.org.springframework.boot.autoconfigure.flyway=DEBUG

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Database access should only happen within the service layer transactions.
spring.jpa.open-in-view=false

# Session expires after 2 hour of inactivity
server.servlet.session.timeout=2h
